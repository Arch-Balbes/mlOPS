services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eta
      POSTGRES_PASSWORD: eta
      POSTGRES_DB: eta_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eta -d eta_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  eta-api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://eta:eta@postgres:5432/eta_db
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: /opt/eta_ml/models/deploy/production.pkl
      CANARY_MODEL_URI: /opt/eta_ml/models/deploy/canary.pkl
      CANARY_WEIGHT: "0.05"
      # Public IPv6 URL (documented in docs/PUBLIC_ACCESS.md)
      ETA_PUBLIC_BASE_URL: "http://[2a00:1370:8184:1c5d:e61b:c8fa:a5ca:aed5]:8000"
    ports:
      # Bind 0.0.0.0:8000 on host, reachable via IPv6 [2a00:...]:8000 when firewall allows
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../models:/opt/eta_ml/models

  prometheus:
    image: prom/prometheus:v2.50.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - eta-api

  airflow-init:
    image: apache/airflow:2.8.4-python3.11
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://eta:eta@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      ETA_PROJECT_ROOT: /opt/eta_ml
      DATABASE_URL: postgresql://eta:eta@postgres:5432/eta_db
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ../dags:/opt/airflow/dags
      - ..:/opt/eta_ml
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true

  airflow:
    image: apache/airflow:2.8.4-python3.11
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://eta:eta@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      ETA_PROJECT_ROOT: /opt/eta_ml
      PYTHONPATH: /opt/eta_ml
      DATABASE_URL: postgresql://eta:eta@postgres:5432/eta_db
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ../dags:/opt/airflow/dags
      - ..:/opt/eta_ml
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
      - postgres
      - mlflow
    command: airflow standalone
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  mlflow_data:
