name: ETA ML CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests dags

      - name: Run tests
        run: pytest tests/ -q

      - name: Pipeline smoke (offline)
        run: python -m src.pipeline.run_all --skip-deploy

      - name: Verify model artifact
        run: test -f models/production.pkl

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-train
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t eta-api:ci .
